<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            margin: 0;
            background-color: #f4f6f9;
            color: #333;
        }
        .sidebar {
            width: 260px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sidebar img {
            width: 90px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        .sidebar h3 {
            margin-top: 10px;
        }
        .nav-item {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            background: #34495e;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }
        .nav-item:hover {
            background: #1abc9c;
        }
        .content {
            flex: 1;
            padding: 20px;
            /* background: #fffaf0; */
            background: #f4f6f9;
        }
        .cards {
            display: flex;
            gap: 20px;
        }
        .card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            text-align: center;
            transition: transform 0.3s;
        }
        .card:hover {
            transform: scale(1.05);
        }
        .card h3 {
            margin-bottom: 10px;
        }
        .icon {
            font-size: 24px;
            margin-top: 10px;
        }
        .notice-board {
            margin-top: 20px;
            background: #1abc9c;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <img src="user.jpg" alt="User">
        <h3>Admin</h3>
        <div class="nav-item" onclick="switchPage('admin')" ><a href="admin.html" style="text-decoration: none; color: white">Dashboard</a></div>
        <div class="nav-item" onclick="switchPage('teachers')" ><a href="adminteacher.html" style="text-decoration: none; color: white">Teachers</a></div>
        <div class="nav-item" onclick="switchPage('students')"><a href="adminstudent.html" style="text-decoration: none; color: white">Students</a></div>
        <div class="nav-item" onclick="switchPage('attendance')"><a href="adminattendance.html" style="text-decoration: none; color: white">Attendance</a></div>
        <div class="nav-item" onclick="switchPage('fee')"><a href="adminfees.html" style="text-decoration: none; color: white">Fee</a></div>
        <div class="nav-item" onclick="switchPage('calendar')"><a href="admincalender.html" style="text-decoration: none; color: white">Calendar</a></div>
        <div class="nav-item" onclick="switchPage('notice')" ><a href="adminnotice.html" style="text-decoration: none; color: white">Notice</a></div>
    </div>


    <div class="content">
        <div class="cards">
            <div class="card" style="background: #d9eaff;">
                <h3>Total Teachers</h3>
                <div class="icon">&#128065;</div>
            </div>
            <div class="card" style="background: #d4fcd4;">
                <h3>Total Students</h3>
                <div class="icon">&#128065;</div>
            </div>
            <div class="card" style="background: #ffcce6;">
                <h3>Fee / Salary</h3>
                <div class="icon">&#8397;</div>
            </div>
        </div>
        <br><br>
        <div class="notice-board">Notice Board</div>
    </div>
</body>
</html>
