    <style>
        body {
    margin: 0;
    font-family: Arial, sans-serif;
    display: flex;
    background: #f4f4f4;
}

.sidebar {
    width: 250px;
    background-color: #1e4a7a;
    color: white;
    padding: 20px 0;
    height: 100vh;
    position: fixed;
    left: 0;
    top: 0;
    overflow-y: auto;
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}
.profile {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 30px;
    padding: 20px 0;
}
.profile img {
    width: 100px;
    height: 100px;
    border-radius: 50%;
    margin-bottom: 10px;
    overflow: hidden;
    border: 3px solid white;

}

.profile-img img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile h2 {
    font-size: 1.2rem;
    text-align: center;
    font-weight: 500;
    margin-bottom: 20px;
}

.nav-menu {
    width: 100%;
    display: flex;
    flex-direction: column;
}

.nav-item {
    display: flex;
    align-items: center;
    padding: 15px 25px;
    color: white;
    text-decoration: none;
    transition: background-color 0.3s;
    margin: 3px 0;
    border-radius: 0 25px 25px 0;
}
.nav-item i {
    margin-right: 15px;
    font-size: 1.2rem;
    width: 24px;
    text-align: center;
}

.nav-item.active {
    background-color: white;
    color: #1e4a7a;
    font-weight: bold;
    margin-right: 15px;
}

.nav-item:hover:not(.active) {
    background-color: rgba(255, 255, 255, 0.1);
}

.sidebar nav ul {
    list-style: none;
    padding: 0;
    text-align: left;
}

.sidebar nav ul li {
    padding: 15px 0;
}

.sidebar nav ul li a {
    color: white;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px;
    border-radius: 5px;
    font-size: 16px;
}

.sidebar nav ul li a.active,
.sidebar nav ul li a:hover {
    background: white;
    color: #1d3557;
    font-weight: bold;
}

.content {
    margin-left: 270px;
    padding: 20px;
    width: calc(100% - 270px);

header {
    display: flex;
    justify-content: space-between;

.search {
    padding: 10px;

    max-width: 300px;

.attendance-container {
    background: white;

    border-radius: 10px;

}

.controls {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
}

button {
    background: #457b9d;
    color: white;
    padding: 10px 15px;
    border: none;
    cursor: pointer;
    border-radius: 5px;
}

button:hover {
    background: #1d3557;
}

table {
    width: 100%;
    border-collapse: collapse;
}

table th, table td {
    padding: 10px;
    border: 1px solid #ddd;
    text-align: left;
}

.submit-btn {
    margin-top: 10px;

    <script>
        document.addEventListener("DOMContentLoaded", () => {
    const navLinks = document.querySelectorAll("nav ul li a");
    
    navLinks.forEach(link => {
        link.addEventListener("click", function() {
            navLinks.forEach(nav => nav.classList.remove("active"));
            this.classList.add("active");
        });
    });
});
    </script>
