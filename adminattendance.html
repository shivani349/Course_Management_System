<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Attendance</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="sidebar">
        <img src="user.jpg" alt="User" />
        <h3>Admin</h3>
        <div class="nav-item"><a href="admin.html">Dashboard</a></div>
        <div class="nav-item"><a href="adminteacher.html">Teachers</a></div>
        <div class="nav-item"><a href="adminstudent.html">Students</a></div>
        <div class="nav-item"><a href="adminattendance.html">Attendance</a></div>
        <div class="nav-item"><a href="adminfees.html">Fee</a></div>
        <div class="nav-item"><a href="admincalender.html">Calendar</a></div>
        <div class="nav-item"><a href="adminnotice.html">Notice</a></div>
    </div>

    <div id="attendanceList" class="content active">
        <h2>Attendance</h2>
        <table id="attendanceTable">
            <tr>
                <th>Section</th>
                <th>View Attendance</th>
            </tr>
            <tr>
                <td>2021-2023</td>
                <td><button onclick="viewAttendance('2021-2023')">🔴</button></td>
            </tr>
            <tr>
                <td>2022-2024</td>
                <td><button onclick="viewAttendance('2022-2024')">🔴</button></td>
            </tr>
        </table>
    </div>

    <div id="viewAttendance" class="content">
        <h2>Attendance Details</h2>
        <label for="date">Select Date:</label>
        <input type="date" id="date" />
        <br /><br />
        <table>
            <tr>
                <th>Student Name</th>
                <th>Status</th>
            </tr>
            <tr>
                <td>John Doe</td>
                <td><input type="checkbox" /></td>
            </tr>
            <tr>
                <td>Jane Smith</td>
                <td><input type="checkbox" /></td>
            </tr>
        </table>
        <br /><br />
        <button onclick="saveAttendance()">Save</button>
        <div class="btn-group">
            <button onclick="showLocalStorage()">Show Local Storage</button>
            <button onclick="clearLocalStorage()">Clear Local Storage</button>
        </div>
        <pre id="localStorageData"></pre>
    </div>

    <script src="script.js"></script>
</body>
</html>
