<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Course Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f9f5f1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-container {
            background: #6e6b6b;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 400px;
            text-align: center;
            color: white;
        }
        .login-container h2 {
            font-style: italic;
            margin-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }
        input {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .role-options {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .role-options button {
            background-color: #d99b9b;
            border: none;
            padding: 12px 24px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            color: white;
            flex: 1;
            margin: 0 5px;
        }
        .role-options button:hover {
            background-color: #c47c7c;
        }
        .btn {
            width: 100%;
            background-color: #d99b9b;
            color: white;
            padding: 14px;
            border: none;
            cursor: pointer;
            border-radius: 20px;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        .btn:hover {
            background-color: #c47c7c;
        }
        .forgot-password {
            margin-top: 10px;
            font-size: 0.9em;
            text-align: right;
        }
        .forgot-password a {
            color: white;
            text-decoration: none;
            cursor: pointer;
        }
        .forgot-password a:hover {
            text-decoration: underline;
        }
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #6e6b6b;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            width: 350px;
            text-align: center;
            color: white;
        }
        .close {
            float: right;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>WELCOME!</h2>
        <p>Please login to continue</p>
        <div class="role-options">
            <button type="button">STUDENT</button>
            <button type="button">ADMIN</button>
            <button type="button">FACULTY</button>
        </div>
        <form id="loginForm">
            <div class="form-group">
                <input type="text" id="username" name="username" placeholder="Username" required>
            </div>
            <div class="form-group">
                <input type="password" id="password" name="password" placeholder="Password" required>
            </div>
            <div class="forgot-password">
                <a href="#" onclick="openEmailModal()">Forgot your password?</a>
            </div>
            <button type="submit" class="btn">LOGIN</button>
        </form>
    </div>
    
    <!-- Forgot Password Modal (Step 1: Email Entry) -->
    <div id="emailModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeEmailModal()">&times;</span>
            <h3>Reset Password</h3>
            <p>Enter your email to receive a verification code.</p>
            <input type="email" id="resetEmail" placeholder="Enter your email" required>
            <button class="btn" onclick="sendVerificationCode()">Send Code</button>
        </div>
    </div>

    <!-- Verification Code Modal (Step 2: Enter Code) -->
    <div id="codeModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeCodeModal()">&times;</span>
            <h3>Enter Verification Code</h3>
            <p>A verification code has been sent to your email.</p>
            <input type="text" id="verificationCode" placeholder="Enter code" required>
            <button class="btn" onclick="verifyCode()">Verify</button>
        </div>
    </div>

    <script>
        function openEmailModal() {
            document.getElementById('emailModal').style.display = 'flex';
        }
        function closeEmailModal() {
            document.getElementById('emailModal').style.display = 'none';
        }
        function sendVerificationCode() {
            alert("Verification code sent to " + document.getElementById('resetEmail').value);
            closeEmailModal();
            document.getElementById('codeModal').style.display = 'flex';
        }
        function closeCodeModal() {
            document.getElementById('codeModal').style.display = 'none';
        }
        function verifyCode() {
            alert("Code verified successfully! You can now reset your password.");
            closeCodeModal();
        }
    </script>
</body>
</html>
