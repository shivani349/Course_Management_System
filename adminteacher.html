<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Dashboard</title>
  <style>
    /* your existing CSS is unchanged */
    body {
        font-family: 'Arial', sans-serif;
        display: flex;
        margin: 0;
        background-color: #f4f6f9;
        color: #333;
    }
    .sidebar {
        width: 260px;
        background: #2c3e50;
        color: white;
        padding: 20px;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
    }
    .sidebar img {
        width: 90px;
        border-radius: 50%;
        margin-bottom: 10px;
    }
    .sidebar h3 {
        margin-top: 10px;
    }
    .nav-item {
        width: 100%;
        padding: 12px;
        margin: 5px 0;
        background: #34495e;
        border-radius: 8px;
        cursor: pointer;
        text-align: center;
        transition: 0.3s;
    }
    .nav-item:hover {
        background: #1abc9c;
    }
    .content {
        flex: 1;
        padding: 20px;
        background: #f4f6f9;
        display: none;
    }
    .active {
        display: block;
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: white;
    }
    table, th, td {
        border: 1px solid black;
    }
    th, td {
        padding: 10px;
        text-align: left;
    }
    .form-group {
        margin-bottom: 10px;
    }
    button {
        background:#2c3e50;
        color: white;
        padding: 10px;
        border: none;
        cursor: pointer;
        margin-top: 10px;
        border-radius: 10%;
    }
    button:hover {
        background: #1abc9c;
    }
    .cards {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 20px;
        max-width: 800px; 
        margin: auto;
    }
    .card {
        flex: 1;
        width: 55%; 
        min-width: 300px;
        background: white;
        padding: 20px;
        border-radius: 10px;
        box-shadow: 2px 2px 10px rgba(0, 0, 0, 0.2);
        text-align: center;
        transition: transform 0.3s;
    }
    .card:hover {
        transform: scale(1.05);
    }
    .card h3 {
        margin-bottom: 10px;
    }
    .icon {
        font-size: 24px;
        margin-top: 10px;
    }
  </style>
</head>
<body>

   
        
<div class="sidebar">
    <img src="user.jpg" alt="User">
    <h3>Admin</h3>
    <div class="nav-item"><a href="#" style="text-decoration: none; color: white" onclick="showPage('teacherDashboard')">Dashboard</a></div>
    <!-- <div class="nav-item"><a href="#" style="text-decoration: none; color: white" onclick="showPage('admin')">Dashboard</a></div> -->
    <div class="nav-item"><a href="#" style="text-decoration: none; color: white" onclick="showPage('students')">Students</a></div>
    <div class="nav-item"><a href="#" style="text-decoration: none; color: white" onclick="showPage('teachers')">Teachers</a></div>
    <div class="nav-item"><a href="#" style="text-decoration: none; color: white" onclick="showPage('fee')">Fee</a></div>
    <div class="nav-item"><a href="#" style="text-decoration: none; color: white" onclick="showPage('attendance')">Attendance</a></div>
    <div class="nav-item"><a href="#" style="text-decoration: none; color: white" onclick="showPage('notice')">Notice</a></div>
    <div class="nav-item"><a href="#" style="text-decoration: none; color: white" onclick="showPage('calendar')">Calendar</a></div>

</div>

<!-- Main Dashboard -->
<div id="teacherDashboard" class="content active">
    <div class="cards">
        <div class="card" style="background: #d9eaff;">
            <button onclick="showPage('viewTeachers')">View All Teachers</button>
            <div class="icon">&#128065;</div>
        </div>
        <div class="card" style="background: #d4fcd4;">
            <button onclick="showPage('addTeacher')">Add Teacher</button>
            <div class="icon">&#128065;</div>
        </div>
        <div class="card" style="background: #f9ffcc;">
            <button onclick="showPage('approveTeacher')">Approve/Update</button>
            <div class="icon">&#128065;</div>
        </div>
        <div class="card" style="background: #ffcce6;">
            <button onclick="showPage('viewSalary')">View Salary</button>
            <div class="icon">&#8377;</div>
        </div>
    </div>
</div>

<!-- View All Teachers -->
<div id="viewTeachers" class="content">
    <h2>Teacher List</h2>
    <table id="teacherTable">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Salary</th>
            <th>Joining Date</th>
            <th>Course</th>
        </tr>
    </table>
    <br><br>
    <button onclick="showPage('teacherDashboard')">Return</button>
</div>

<!-- Add New Teacher -->
<div id="addTeacher" class="content">
    <h2>Hire New Teacher</h2>
    <div class="form-group">
        <input type="text" id="firstName" placeholder="First Name">
        <input type="text" id="lastName" placeholder="Last Name">
    </div>
    <div class="form-group">
        <input type="text" id="userId" placeholder="User ID">
        <input type="text" id="course" placeholder="Course">
    </div>
    <div class="form-group">
        <input type="text" id="mobile" placeholder="Mobile">
        <input type="text" id="salary" placeholder="Salary">
    </div>
    <br><br>
    <button onclick="addTeacher()">Hire</button>
    <br><br>
    <button onclick="showPage('teacherDashboard')">Return</button>
</div>

<!-- Approve / Update Teacher -->
<div id="approveTeacher" class="content">
    <h2>Approve/Update Teachers</h2>
    <table id="approveTable">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Mobile</th>
            <th>Course</th>
            <th>Update</th>
            <th>Delete</th>
        </tr>
    </table>
    <br><br>
    <button onclick="showPage('teacherDashboard')">Return</button>
</div>

<!-- View Salary -->
<div id="viewSalary" class="content">
    <h2>Teacher Salary</h2>
    <table id="salaryTable">
        <tr>
            <th>Id</th>
            <th>Name</th>
            <th>Salary</th>
        </tr>
    </table>
    <br><br>
    <button onclick="showPage('teacherDashboard')">Return</button>
</div>

<script>
    function showPage(pageId) {
        document.querySelectorAll('.content').forEach(page => page.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        if (pageId === 'viewTeachers') loadTeacherTable();
        if (pageId === 'approveTeacher') loadApproveTable();
        if (pageId === 'viewSalary') loadSalaryTable();
    }

    function getTeachers() {
        return JSON.parse(localStorage.getItem('teachers') || '[]');
    }

    function saveTeachers(teachers) {
        localStorage.setItem('teachers', JSON.stringify(teachers));
    }

    function addTeacher() {
        const teachers = getTeachers();
        const teacher = {
            id: document.getElementById("userId").value ,
            name: document.getElementById("firstName").value + " " + document.getElementById("lastName").value,
            mobile: document.getElementById("mobile").value,
            salary: document.getElementById("salary").value,
            joiningDate: new Date().toLocaleDateString(),
            course: document.getElementById("course").value
        };
        teachers.push(teacher);
        saveTeachers(teachers);
        alert("Teacher Hired Successfully!");
        document.getElementById("firstName").value = "";
        document.getElementById("lastName").value = "";
        document.getElementById("userId").value = "";
        document.getElementById("course").value = "";
        document.getElementById("mobile").value = "";
        document.getElementById("salary").value = "";
    }

    function loadTeacherTable() {
        const table = document.getElementById("teacherTable");
        const teachers = getTeachers();
        table.innerHTML = `
            <tr>
                <th>Id</th><th>Name</th><th>Mobile</th><th>Salary</th><th>Joining Date</th><th>Course</th>
            </tr>`;
        teachers.forEach(t => {
            table.innerHTML += `
                <tr>
                    <td>${t.id}</td><td>${t.name}</td><td>${t.mobile}</td>
                    <td>${t.salary}</td><td>${t.joiningDate}</td><td>${t.course}</td>
                </tr>`;
        });
    }

    
let editingId = null; // global variable

function loadApproveTable() {
    const table = document.getElementById("approveTable");
    const teachers = getTeachers();
    table.innerHTML = `
        <tr>
            <th>Id</th><th>Name</th><th>Mobile</th><th>Course</th><th>Salary</th><th>Actions</th>
        </tr>`;

    teachers.forEach(t => {
        if (editingId === t.id) {
            table.innerHTML += `
            <tr>
                <td>${t.id}</td>
                <td><input id="editName" value="${t.name}"></td>
                <td><input id="editMobile" value="${t.mobile}"></td>
                <td><input id="editCourse" value="${t.course}"></td>
                <td><input id="editSalary" value="${t.salary}"></td>
                <td>
                    <button onclick="saveTeacherUpdate('${t.id}')">💾 Save</button>
                    <button onclick="cancelEdit()">❌ Cancel</button>
                </td>
            </tr>`;
        } else {
            table.innerHTML += `
            <tr>
                <td>${t.id}</td>
                <td>${t.name}</td>
                <td>${t.mobile}</td>
                <td>${t.course}</td>
                <td>${t.salary}</td>
                <td>
                    <button onclick="editTeacher('${t.id}')">✏ Edit</button>
                    <button onclick="deleteTeacher('${t.id}')">🗑 Delete</button>
                </td>
            </tr>`;
        }
    });
}

function editTeacher(id) {
    editingId = id;
    loadApproveTable(); // re-render to show editable row
}

function cancelEdit() {
    editingId = null;
    loadApproveTable(); // re-render normal view
}

function saveTeacherUpdate(id) {
    const teachers = getTeachers();
    const t = teachers.find(t => t.id === id);

    const newName = document.getElementById("editName").value.trim();
    const newMobile = document.getElementById("editMobile").value.trim();
    const newCourse = document.getElementById("editCourse").value.trim();
    const newSalary = document.getElementById("editSalary").value.trim();

    if (newName && newMobile && newCourse && newSalary) {
        t.name = newName;
        t.mobile = newMobile;
        t.course = newCourse;
        t.salary = newSalary;

        saveTeachers(teachers);
        editingId = null;
        alert("Teacher updated successfully!");
        loadApproveTable();
        loadTeacherTable();
        loadSalaryTable();
    } else {
        alert("All fields are required!");
    }
}

    function deleteTeacher(id) {
        let teachers = getTeachers();
        teachers = teachers.filter(t => t.id !== id);
        saveTeachers(teachers);
        loadApproveTable();
        loadTeacherTable();
        loadSalaryTable();
    }

    function loadSalaryTable() {
        const table = document.getElementById("salaryTable");
        const teachers = getTeachers();
        table.innerHTML = `
            <tr><th>Id</th><th>Name</th><th>Salary</th></tr>`;
        teachers.forEach(t => {
            table.innerHTML += `
                <tr><td>${t.id}</td><td>${t.name}</td><td>${t.salary}</td></tr>`;
        });
    }
</script>
</body>
</html>
