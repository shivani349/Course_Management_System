<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Calendar</title>
    <style>
       body {
            font-family: 'Arial', sans-serif;
            display: flex;
            margin: 0;
            background-color: #f4f6f9;
            color: #333;
        }
        .sidebar {
            width: 260px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .sidebar img {
            width: 90px;
            border-radius: 50%;
            margin-bottom: 10px;
        }
        .sidebar h3 {
            margin-top: 10px;
        }
        .nav-item {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            background: #34495e;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: 0.3s;
        }
        .nav-item:hover {
            background: #1abc9c;
        }
        .content {
            flex: 1;
            padding: 20px;
            background: #f4f6f9;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <img src="user.jpg" alt="Admin">
        <h3>ADMIN</h3>
        <div class="nav-item" onclick="switchPage('admin')" ><a href="admin.html" style="text-decoration: none; color: white">Dashboard</a></div>
        <div class="nav-item" onclick="switchPage('teachers')" ><a href="adminteacher.html" style="text-decoration: none; color: white">Teachers</a></div>
        <div class="nav-item" onclick="switchPage('students')"><a href="adminstudent.html" style="text-decoration: none; color: white">Students</a></div>
        <div class="nav-item" onclick="switchPage('attendance')"><a href="adminattendance.html" style="text-decoration: none; color: white">Attendance</a></div>
        <div class="nav-item" onclick="switchPage('fee')"><a href="adminfees.html" style="text-decoration: none; color: white">Fee</a></div>
        <div class="nav-item" onclick="switchPage('calendar')"><a href="admincalender.html" style="text-decoration: none; color: white">Calendar</a></div>
        <div class="nav-item" onclick="switchPage('notice')" ><a href="adminnotice.html" style="text-decoration: none; color: white">Notice</a></div>
    </div>
    
    <div class="content">
        <h2>Calendar</h2>
        <iframe src="https://calendar.google.com/calendar/embed?src=en.indian%23holiday%40group.v.calendar.google.com&ctz=Asia/Kolkata" style="border: 0" width="800" height="600" frameborder="0" scrolling="no"></iframe>
    </div>
</body>
</html>
